name: Publish DWD Radar Tiles

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: dwd-radar-static
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: RadarProxy
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: RadarProxy/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate static radar site
        env:
          STATIC_RADAR_OUTPUT_DIR: site
          STATIC_TILE_MIN_Z: "4"
          STATIC_TILE_MAX_Z: "7"
          DWD_RADAR_PAST_HOURS: "24"
          DWD_RADAR_PAST_STEP_MINUTES: "60"
        run: python generate_static_site.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: RadarProxy/site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
