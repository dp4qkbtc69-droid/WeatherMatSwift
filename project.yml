name: WeatherMat
options:
  bundleIdPrefix: de.praxishartlep
  deploymentTarget:
    iOS: "17.0"
    watchOS: "11.0"
  xcodeVersion: "26.6"
  createIntermediateGroups: true

schemes:
  WeatherMat:
    build:
      targets:
        WeatherMat: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - WeatherMatTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEVELOPMENT_TEAM: "5P532N3MK4"

targets:

  # ── Main App ──────────────────────────────────────────────────────────────
  WeatherMat:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: WeatherMat
        excludes:
          - "**/*.md"
          - "Shared/**"
    info:
      path: WeatherMat/Info.plist
      properties:
        CFBundleDisplayName: WeatherMat
        CFBundleShortVersionString: "1.1"
        CFBundleVersion: "4"
        # App only uses standard HTTPS (exempt) — skips the export-compliance
        # question on every TestFlight upload.
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        NSLocationWhenInUseUsageDescription: "WeatherMat benötigt deinen Standort für lokale Wetterdaten."
        NSLocationAlwaysAndWhenInUseUsageDescription: "WeatherMat benötigt deinen Standort für lokale Wetterdaten."
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        CFBundleURLTypes:
          - CFBundleURLName: de.praxishartlep.weathermat.netatmo
            CFBundleURLSchemes:
              - weathermat
        UIBackgroundModes:
          - fetch
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        BGTaskSchedulerPermittedIdentifiers:
          - de.praxishartlep.weathermat.refresh
    entitlements:
      path: WeatherMat/WeatherMat.entitlements
      properties:
        com.apple.developer.weatherkit: true
        # production is what TestFlight/App Store builds use; the proxy
        # auto-detects sandbox vs production per token, so Xcode dev builds
        # (sandbox) keep working too.
        aps-environment: production
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.praxishartlep.weathermat
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_FILE: WeatherMat/Info.plist
        CODE_SIGN_ENTITLEMENTS: WeatherMat/WeatherMat.entitlements
        MARKETING_VERSION: "1.1"
        CURRENT_PROJECT_VERSION: "4"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
    dependencies:
      - sdk: WeatherKit.framework
      - sdk: CoreLocation.framework
      - sdk: MapKit.framework
      - sdk: BackgroundTasks.framework
      - sdk: AuthenticationServices.framework
      - sdk: Security.framework
      - sdk: WatchConnectivity.framework
      - target: WeatherMatWatch
        embed: true

  # ── watchOS Companion App ─────────────────────────────────────────────────
  WeatherMatWatch:
    type: application
    platform: watchOS
    deploymentTarget: "11.0"
    sources:
      - path: WeatherMatWatch/App
      - path: WeatherMatWatch/Shared
    info:
      path: WeatherMatWatch/App/Info.plist
      properties:
        CFBundleDisplayName: WeatherMat
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        WKApplication: true
        WKCompanionAppBundleIdentifier: de.praxishartlep.weathermat
        NSLocationWhenInUseUsageDescription: "WeatherMat benötigt deinen Standort für lokale Wetterdaten auf der Uhr."
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    entitlements:
      path: WeatherMatWatch/App/WeatherMatWatch.entitlements
      properties:
        com.apple.developer.weatherkit: true
        com.apple.security.application-groups:
          - group.de.praxishartlep.weathermat.watch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.praxishartlep.weathermat.watchkitapp
        TARGETED_DEVICE_FAMILY: "4"
        INFOPLIST_FILE: WeatherMatWatch/App/Info.plist
        CODE_SIGN_ENTITLEMENTS: WeatherMatWatch/App/WeatherMatWatch.entitlements
        SDKROOT: watchos
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
    dependencies:
      - sdk: WeatherKit.framework
      - sdk: CoreLocation.framework
      - sdk: WatchConnectivity.framework
      - sdk: WidgetKit.framework
      - target: WeatherMatWatchWidgets
        embed: true

  # ── watchOS Complication (WidgetKit) ──────────────────────────────────────
  WeatherMatWatchWidgets:
    type: app-extension
    platform: watchOS
    deploymentTarget: "11.0"
    sources:
      - path: WeatherMatWatch/Widgets
      - path: WeatherMatWatch/Shared
    info:
      path: WeatherMatWatch/Widgets/Info.plist
      properties:
        CFBundleDisplayName: WeatherMat
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: WeatherMatWatch/Widgets/WeatherMatWatchWidgets.entitlements
      properties:
        com.apple.developer.weatherkit: true
        com.apple.security.application-groups:
          - group.de.praxishartlep.weathermat.watch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.praxishartlep.weathermat.watchkitapp.widgets
        TARGETED_DEVICE_FAMILY: "4"
        INFOPLIST_FILE: WeatherMatWatch/Widgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: WeatherMatWatch/Widgets/WeatherMatWatchWidgets.entitlements
        SDKROOT: watchos
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
    dependencies:
      - sdk: WeatherKit.framework
      - sdk: CoreLocation.framework
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework

  WeatherMatTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: WeatherMatTests
    dependencies:
      - target: WeatherMat
      - sdk: XCTest.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.praxishartlep.weathermatTests
        GENERATE_INFOPLIST_FILE: YES
