services:
  radar-proxy:
    build: .
    restart: unless-stopped
    environment:
      RADAR_PROXY_TOKEN: "${RADAR_PROXY_TOKEN:?Set RADAR_PROXY_TOKEN in .env}"
      DWD_RADAR_RENDER_MODE: "${DWD_RADAR_RENDER_MODE:-native}"
      DWD_RADAR_NATIVE_FRAME_STEP_MINUTES: "${DWD_RADAR_NATIVE_FRAME_STEP_MINUTES:-10}"
      DWD_ICON_WMS_RECOLOR: "${DWD_ICON_WMS_RECOLOR:-true}"
      DWD_ICON_RAW_MODE: "${DWD_ICON_RAW_MODE:-auto}"
      DWD_ICON_RAW_FORECAST_HOURS: "${DWD_ICON_RAW_FORECAST_HOURS:-72}"
      DWD_ICON_RAW_MAX_FRAMES: "${DWD_ICON_RAW_MAX_FRAMES:-72}"
      RADAR_DISK_CACHE_DIR: "/tiles"
      DWD_RADAR_DISK_CACHE_MAX_AGE_SECONDS: "${DWD_RADAR_DISK_CACHE_MAX_AGE_SECONDS:-86400}"
      DWD_RADAR_DISK_CACHE_PRUNE_INTERVAL_SECONDS: "${DWD_RADAR_DISK_CACHE_PRUNE_INTERVAL_SECONDS:-3600}"
      DWD_WMS_LAYER: "${DWD_WMS_LAYER:-Radar_rv_product_1x1km_ger}"
      DWD_RADAR_TILE_MAX_ZOOM: "${DWD_RADAR_TILE_MAX_ZOOM:-13}"
      RADAR_TILE_RENDER_SCALE: "${RADAR_TILE_RENDER_SCALE:-2}"
      DWD_RADAR_PAST_HOURS: "${DWD_RADAR_PAST_HOURS:-24}"
      DWD_RADAR_PAST_STEP_MINUTES: "${DWD_RADAR_PAST_STEP_MINUTES:-15}"
      DWD_RADAR_CACHE_SECONDS: "${DWD_RADAR_CACHE_SECONDS:-240}"
      DWD_RADAR_REFRESH_INTERVAL_SECONDS: "${DWD_RADAR_REFRESH_INTERVAL_SECONDS:-300}"
      DWD_RADAR_STARTUP_WARM: "${DWD_RADAR_STARTUP_WARM:-true}"
      DWD_RADAR_WARM_TILES: "${DWD_RADAR_WARM_TILES:-true}"
      # Keep warming SINGLE-threaded on this 2-core box: it leaves one core free
      # for live playback tile requests. Parallel (2) warming pegs both cores and
      # starves the radar the moment the app opens (which triggers a warm),
      # causing playback to stall — live latency matters more than warm speed.
      DWD_RADAR_WARM_WORKERS: "${DWD_RADAR_WARM_WORKERS:-1}"
      # Warm the overview zooms (5,6) for every frame so jumping to follow-up
      # days shows tiles immediately; detail zoom (7) stays near-term only.
      DWD_RADAR_WARM_FRAME_LIMIT: "${DWD_RADAR_WARM_FRAME_LIMIT:-96}"
      DWD_RADAR_WARM_DETAIL_FRAME_LIMIT: "${DWD_RADAR_WARM_DETAIL_FRAME_LIMIT:-10}"
      DWD_RADAR_WARM_ZOOMS: "${DWD_RADAR_WARM_ZOOMS:-5,6}"
      DWD_RADAR_WARM_DETAIL_ZOOMS: "${DWD_RADAR_WARM_DETAIL_ZOOMS:-7}"
      DWD_RADAR_HOTSPOT_WARM: "${DWD_RADAR_HOTSPOT_WARM:-true}"
      DWD_RADAR_HOTSPOT_LAT: "${DWD_RADAR_HOTSPOT_LAT:-50.088}"
      DWD_RADAR_HOTSPOT_LON: "${DWD_RADAR_HOTSPOT_LON:-9.064}"
      DWD_RADAR_HOTSPOT_RADIUS_TILES: "${DWD_RADAR_HOTSPOT_RADIUS_TILES:-1}"
      DWD_RADAR_HOTSPOT_ZOOMS: "${DWD_RADAR_HOTSPOT_ZOOMS:-7,8,9,10,11,12}"
      # Warm the app's local open-view detail zooms (~z8) around every hotspot,
      # for all frames, so radar playback at the default zoom is cache-served.
      DWD_RADAR_HOTSPOT_DETAIL_ZOOMS: "${DWD_RADAR_HOTSPOT_DETAIL_ZOOMS:-7,8,9}"
      DWD_RADAR_HOTSPOT_DETAIL_FRAME_LIMIT: "${DWD_RADAR_HOTSPOT_DETAIL_FRAME_LIMIT:-96}"
      DWD_RADAR_HOTSPOT_DETAIL_HALF_KM: "${DWD_RADAR_HOTSPOT_DETAIL_HALF_KM:-75}"
      # How many user locations to keep warm (app registers all its saved ones).
      DWD_RADAR_DYNAMIC_HOTSPOTS_MAX: "${DWD_RADAR_DYNAMIC_HOTSPOTS_MAX:-16}"
      # Optics: continuous colour ramp instead of hard bands + edge feathering.
      DWD_RADAR_SMOOTH_PALETTE: "${DWD_RADAR_SMOOTH_PALETTE:-true}"
      DWD_RADAR_FEATHER_RADIUS: "${DWD_RADAR_FEATHER_RADIUS:-0.8}"
      # Hide precip below this rate (mm/h). 0.3 drops the very-light class to
      # calm the view; lower keeps light rain; 0 shows everything.
      DWD_RADAR_MIN_INTENSITY: "${DWD_RADAR_MIN_INTENSITY:-0.3}"
      # Region-pack (client-side rendering): output raster size and intensity
      # quantization scale (mm/h * scale, clamped to uint8).
      DWD_RADAR_REGION_GRID_SIZE: "${DWD_RADAR_REGION_GRID_SIZE:-384}"
      DWD_RADAR_REGION_QUANT_SCALE: "${DWD_RADAR_REGION_QUANT_SCALE:-5.0}"
      # Linearly blend the first ICON-EU model frames against the last DWD-RV
      # nowcast field over this many minutes, so the nowcast->model handoff
      # isn't an abrupt jump. 0 disables blending.
      DWD_RADAR_HANDOFF_MINUTES: "${DWD_RADAR_HANDOFF_MINUTES:-60}"
      APNS_TEAM_ID: "${APNS_TEAM_ID:-}"
      APNS_KEY_ID: "${APNS_KEY_ID:-}"
      APNS_KEY_PATH: "/apns/AuthKey.p8"
      APNS_TOPIC: "${APNS_TOPIC:-de.praxishartlep.weathermat}"
      # Which APNs environment to try first; the server falls back to the
      # other per token automatically. Production-first suits TestFlight.
      APNS_USE_SANDBOX: "${APNS_USE_SANDBOX:-false}"
      APNS_MIN_SEVERITY: "${APNS_MIN_SEVERITY:-Moderate}"
      PUSH_STATE_PATH: "/data/push_state.json"
      # Persist dynamic hotspots on the same volume so user-warmed locations
      # survive a container restart (deploy, monthly rebuild, OOM).
      HOTSPOTS_STATE_PATH: "/data/hotspots.json"
    volumes:
      - ./apns:/apns:ro
      - push_data:/data
      - tile_cache:/tiles
    expose:
      - "8787"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os, urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/health?token=' + os.environ['RADAR_PROXY_TOKEN'], timeout=20).read()\""]
      interval: 5m
      timeout: 30s
      retries: 2
      start_period: 30s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - radar-proxy
    environment:
      RADAR_DOMAIN: "${RADAR_DOMAIN:?Set RADAR_DOMAIN in .env}"
    ports:
      - "80:80"
      - "443:443"
      # HTTP/3 (QUIC) — iOS prefers it and caches its availability, so it
      # must be forwarded, not dropped, or the app stalls before TCP fallback.
      - "443:443/udp"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
  push_data:
  tile_cache:
